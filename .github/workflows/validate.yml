name: Validate mathematical examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests and independent bounded validation
        run: python scripts/validate.py
      - name: Demonstration
        run: python -m fourcolor demo
      - name: Upload exact validation record
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: outputs/validation.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Marker selection and geometry tests
        run: npm test
      - name: Independent Python reconstruction of web certificates
        run: python scripts/validate_web.py
      - name: Independent line-first construction certificates
        run: python scripts/validate_construction.py
      - name: Bounded abstract research oracle, separate from production
        run: python scripts/search_construction_gap.py
      - name: Build static website
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-validation
          path: |
            outputs/web-validation.json
            outputs/construction-validation-2026-09-08.json
            outputs/reverse-merge-search-2026-09-08.json
