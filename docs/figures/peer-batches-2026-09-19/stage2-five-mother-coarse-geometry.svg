<text x="1180" y="435" font-size="24" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">第2阶段：s3、s4、s5、s6 就绪</text>
<text x="1180" y="491" font-size="24" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">s13 的边界到第3阶段才齐全。</text>
<text x="1180" y="547" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#00618A">先处理右侧已就绪区域，</text>
<text x="1180" y="591" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#00618A">再决定左侧更深分割的名字。</text>
<text x="1180" y="663" font-size="23" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">初始化 s2 = 2 是唯一提前例外：</text>
<text x="1180" y="707" font-size="23" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">由外侧保持1的全局名字置换保证；</text>
<text x="1180" y="751" font-size="23" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">不强迫整个 C2 的后代同色。</text>
<text x="1180" y="823" font-size="22" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">同级不等于同色；粗区域不是最终侧。</text>
<text x="50" y="1002" font-size="27" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">r(F) = 最后一个真实共边激活的阶段。母线浅，不代表它沿线的每个最终侧都浅。</text>
<text x="50" y="1059" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">全部线使用正式输入原坐标；灰虚线只表示暂未激活，没有删除或移动任何细线。</text>
<text x="50" y="1111" font-size="24" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">该判据证明几何就绪与分区细化，不证明后续每个最小候选都能延伸成完整配色。</text>
</svg>
