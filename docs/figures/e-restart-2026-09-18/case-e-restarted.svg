<text x="60" y="30" font-size="44" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">案例 E 更正｜内部可以复用 1</text>
<text x="60" y="100" font-size="28" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">按相同画线顺序从外圈重算；左右均为合法已提交状态，不是旧名草稿。</text>
<text x="60" y="175" font-size="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">第 7 步后：G 已取 1</text>
<text x="60" y="222" font-size="24" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">外侧固定 1；字母仅标位置，数字为当前侧名</text>
