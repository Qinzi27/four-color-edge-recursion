<text x="1619.3" y="550.25" font-size="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="middle" dominant-baseline="text-before-edge" fill="#505B67">R: 4</text>
<text x="1214.3" y="550.25" font-size="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="middle" dominant-baseline="text-before-edge" fill="#505B67">L: 2</text>
<text x="60" y="830" font-size="28" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#00618A">G 的完整邻名为 {2, 3, 4}，不含 1；最小可用名就是 1。</text>
<text x="60" y="880" font-size="26" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">橙色实线：最后新增且已通过校验的线。两图等比例，几何与原例相同。</text>
<text x="60" y="927" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">其余名字也按统一规则重算，不能与冻结旧名图拼接；本例成功不等于一般证明。</text>
</svg>
