<text x="55" y="96" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">guillotine-20261213，第17步｜同一几何、同一初始规范化｜回到线侧重新命名主线</text>
<text x="55" y="153" font-size="29" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">A  旧 v2：同名提议导致冲突</text>
<text x="855" y="153" font-size="29" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">B  加入结构关系：完成合法命名</text>
<text x="55" y="205" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#B74400">旧尝试：S1=2，S10=2 → 冲突</text>
<text x="855" y="205" font-size="24" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#00618A">已证 c1≠c10；实际取 S1=2，S10=3</text>
<text x="55" y="251" font-size="23" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">外侧 S0 的名字为1；内部仅显示侧身份</text>
<text x="855" y="251" font-size="23" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">外侧名字为1；内部数字为实际名字</text>
