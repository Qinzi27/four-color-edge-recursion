<text x="55" y="682" font-size="26" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#202831">两条蓝线都是桥：仍可绕过缺口，上下是同一个面。最后一条闭合后，三条蓝线才都成为面分界。</text>
