<text x="60" y="850" font-size="27" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#00618A">左图蓝线两端均接外圈；它先命名并立即承诺最小名，随后遇到空候选。</text>
<text x="60" y="900" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">需区分：先分析这条线，是否等于立即固定其两侧名字？本图不否定更灵活的母线规则。</text>
