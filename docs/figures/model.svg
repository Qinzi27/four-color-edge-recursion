<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 338" role="img" aria-labelledby="title desc">
  <title id="title">Edge-side recursion: directed sides, split history, and global consistency</title>
  <desc id="desc">Three panels: a directed edge has face colors 1 and 2 on its left and right. Splitting the color-2 side creates edges labeled 1,2; 1,3; and 2,3. In the dual triangle, differences 01,10,11 sum to zero, whereas three 01 labels conflict.</desc>
  <rect width="1080" height="338" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172536">
    <text x="24" y="30" font-size="19" font-weight="bold">1. Directed edge</text>
    <text x="382" y="30" font-size="19" font-weight="bold">2. Split history</text>
    <text x="740" y="30" font-size="19" font-weight="bold">3. Dual closed walk</text>
    <path d="M354 20V318 M712 20V318" stroke="#cbd5e1"/>
    <rect x="25" y="55" width="300" height="94" fill="#cce6f7"/>
    <rect x="25" y="149" width="300" height="94" fill="#ffe0a8"/>
    <path d="M25 149H325" stroke="#172536" stroke-width="3"/>
    <path d="M309 142L325 149L309 156" fill="none" stroke="#172536" stroke-width="3"/>
    <text x="175" y="105" text-anchor="middle" font-size="18">F1 / color 1 / LEFT</text>
    <text x="175" y="207" text-anchor="middle" font-size="18">F2 / color 2 / RIGHT</text>
    <text x="175" y="274" text-anchor="middle" font-size="21">e = (1, 2)</text>
    <text x="175" y="306" text-anchor="middle" font-size="15">Reverse direction: (2, 1)</text>
    <rect x="383" y="55" width="300" height="94" fill="#cce6f7"/>
    <rect x="383" y="149" width="150" height="94" fill="#ffe0a8"/>
    <rect x="533" y="149" width="150" height="94" fill="#c7eee1"/>
    <path d="M383 149H683 M533 243V149" stroke="#172536" stroke-width="3"/>
    <text x="533" y="97" text-anchor="middle" font-size="18">1</text>
    <text x="453" y="207" text-anchor="middle" font-size="18">2</text>
    <text x="613" y="207" text-anchor="middle" font-size="18">3</text>
    <g font-size="16"><text x="428" y="140">(1,2)</text><text x="586" y="140">(1,3)</text><text x="540" y="232">(2,3)</text></g>
    <text x="533" y="274" text-anchor="middle" font-size="21">(1, (2, 3)) = history</text>
    <text x="533" y="306" text-anchor="middle" font-size="15">New path connects to the boundary.</text>
    <path d="M893 68L771 225H1015Z" stroke="#172536" stroke-width="3" fill="none"/>
    <g fill="#f8fafc" stroke="#172536" stroke-width="2"><circle cx="893" cy="68" r="24"/><circle cx="771" cy="225" r="24"/><circle cx="1015" cy="225" r="24"/></g>
    <g text-anchor="middle" font-size="17"><text x="893" y="74">00</text><text x="771" y="231">01</text><text x="1015" y="231">11</text></g>
    <g font-size="17"><text x="808" y="143">01</text><text x="961" y="143">11</text><text x="884" y="217">10</text></g>
    <text x="893" y="274" text-anchor="middle" font-size="20">01 XOR 10 XOR 11 = 00</text>
    <text x="893" y="306" text-anchor="middle" font-size="15">Three 01 labels would be inconsistent.</text>
  </g>
</svg>
