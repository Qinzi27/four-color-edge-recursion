<text x="60" y="835" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#505B67">这只否定冻结旧名的一步选择，不是否定四名可行。</text>
