<text x="55" y="958" font-size="27" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="start" dominant-baseline="text-before-edge" fill="#00618A">若你给出命名顺序，可以逐步和程序的候选表核对，找出仍缺少的约束。</text>
